<script>
    // ============================================
    // PROXY CONFIGURATION - 100% CSP COMPLIANT
    // ============================================
    
    const PROXY_URL = 'supabase-proxy.php?path=';

    // ============================================
    // SUPABASE FETCH FUNCTIONS - USING PROXY
    // ============================================
    
    async function supabaseFetch(table, options = {}) {
        const { filters = {}, single = false, limit = null } = options;
        
        let url = `${PROXY_URL}${table}?select=*`;
        
        Object.entries(filters).forEach(([key, value]) => {
            if (value !== undefined && value !== null) {
                url += `&${key}=eq.${encodeURIComponent(value)}`;
            }
        });
        
        if (limit) url += `&limit=${limit}`;
        
        console.log('Fetching:', url);
        
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        return single ? data[0] : data;
    }

    async function supabaseInsert(table, data) {
        const url = `${PROXY_URL}${table}`;
        
        console.log('Inserting to:', url, data);
        
        const response = await fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(Array.isArray(data) ? data : [data])
        });
        
        if (!response.ok) {
            const text = await response.text();
            throw new Error(`HTTP ${response.status}: ${text}`);
        }
        
        return await response.json();
    }

    // ============================================
    // K95 FOODS - SALES ORDER SYSTEM
    // USING PROXY FOR ALL REQUESTS
    // ============================================
    
    class K95OrderApp {
        constructor() {
            // REMOVED: this.SUPABASE_URL and this.SUPABASE_ANON_KEY
            // Now using PROXY_URL instead
            
            // Cache Keys
            this.CACHE = {
                USER: 'k95_user',
                LAST_DISTRIBUTOR: 'k95_last_distributor',
                OUTLETS: 'k95_outlets_',
                PRODUCTS: 'k95_products'
            };
            
            // State
            this.currentUser = null;
            this.currentDistributor = null;
            this.distributorsList = [];
            this.outletsData = [];
            this.productsData = [];
            this.inventory = {};
            this.orderItems = {};
            this.isNewOutlet = false;
            
            // Initialize
            this.init();
        }

        // ============================================
        // INITIALIZATION
        // ============================================
        
        async init() {
            console.log('K95 Foods - Initializing...');
            
            // Check for existing session
            const savedUser = localStorage.getItem(this.CACHE.USER);
            if (savedUser) {
                try {
                    const userData = JSON.parse(savedUser);
                    document.getElementById('email').value = userData.email;
                    this.currentUser = { email: userData.email };
                    document.getElementById('userEmail').textContent = userData.email;
                    document.getElementById('logoutBtn').style.display = 'block';
                    
                    // Auto-fetch distributors
                    setTimeout(() => this.handleGetDistributors(), 100);
                } catch (e) {
                    console.error('Session restore failed:', e);
                    localStorage.removeItem(this.CACHE.USER);
                }
            }
        }

        // ============================================
        // MODIFICATION: Get Distributors by Email
        // ============================================
        
        async handleGetDistributors() {
            const email = document.getElementById('email').value.trim();
            if (!email) {
                this.showMessage('Please enter your email', 'error', 'loginMessage');
                return;
            }

            this.showMessage('Fetching your distributors...', 'success', 'loginMessage');
            
            try {
                // CHANGE THIS LINE - Add status=eq.Active filter
                const allDistributors = await supabaseFetch('distributors', {
                    filters: { 
                        status: 'Active'  // ✅ ONLY ACTIVE DISTRIBUTORS
                    }
                });
                
                // Filter distributors where email is in comma-separated allowed_emails
                const distributors = allDistributors.filter(dist => {
                    if (!dist.allowed_emails) return false;
                    const emails = dist.allowed_emails.split(',').map(e => e.trim().toLowerCase());
                    return emails.includes(email.toLowerCase());
                });

                if (!distributors || distributors.length === 0) {
                    this.showMessage('No distributors found for this email', 'error', 'loginMessage');
                    return;
                }

                // Store distributors and user
                this.distributorsList = distributors;
                this.currentUser = { email };
                
                // Save to localStorage
                localStorage.setItem(this.CACHE.USER, JSON.stringify({
                    email,
                    distributors: distributors.map(d => d.distributor_id)
                }));
                
                document.getElementById('userEmail').textContent = email;
                document.getElementById('logoutBtn').style.display = 'block';

                // Sort distributors alphabetically
                distributors.sort((a, b) => a.distributor_name.localeCompare(b.distributor_name));
                
                // Populate distributor dropdown
                const distributorSelect = document.getElementById('distributorSel');
                distributorSelect.innerHTML = '<option value="">Select your distributor...</option>';
                
                distributors.forEach(dist => {
                    const option = document.createElement('option');
                    option.value = dist.distributor_id;
                    option.textContent = dist.distributor_name;
                    distributorSelect.appendChild(option);
                });

                // Show distributor section
                document.getElementById('distributorSection').style.display = 'block';
                document.getElementById('distributorMessage').textContent = `Found ${distributors.length} distributor(s)`;
                
                // Check for last used distributor
                const lastDistributorId = localStorage.getItem(this.CACHE.LAST_DISTRIBUTOR);
                if (lastDistributorId && distributors.some(d => d.distributor_id === lastDistributorId)) {
                    distributorSelect.value = lastDistributorId;
                    await this.onDistributorChange(lastDistributorId);
                }
                
                this.showMessage(`Found ${distributors.length} distributor(s)`, 'success', 'loginMessage');
                
            } catch (error) {
                console.error('Error fetching distributors:', error);
                this.showMessage('Error: ' + error.message, 'error', 'loginMessage');
            }
        }

        // ============================================
        // MODIFICATION: On Distributor Change
        // ============================================
        
        async onDistributorChange(distributorId) {
            if (!distributorId) return;
            
            this.currentDistributor = this.distributorsList.find(d => d.distributor_id === distributorId);
            if (!this.currentDistributor) return;
            
            localStorage.setItem(this.CACHE.LAST_DISTRIBUTOR, distributorId);
            
            const userData = JSON.parse(localStorage.getItem(this.CACHE.USER) || '{}');
            userData.distributor_id = distributorId;
            userData.distributor_name = this.currentDistributor.distributor_name;
            localStorage.setItem(this.CACHE.USER, JSON.stringify(userData));
        
            document.getElementById('distributorDisplay').textContent = this.currentDistributor.distributor_name;
            document.getElementById('orderSection').style.display = 'block';
            document.getElementById('loginSection').style.display = 'none';
            
            const cachedOutlets = localStorage.getItem(this.CACHE.OUTLETS + distributorId);
            if (cachedOutlets) {
                console.log('Loading outlets from cache');
                this.outletsData = JSON.parse(cachedOutlets);
                // ✅ SORT ALREADY APPLIED IN CACHE
                this.renderOutlets();
                await this.loadProducts();
                return;
            }
        
            try {
                this.showMessage('Loading outlets...', 'success', 'loginMessage');
                
                // CHANGE THIS - Add status=eq.Active filter
                this.outletsData = await supabaseFetch('outlets', {
                    filters: {
                        distributor_id: distributorId,
                        status: 'Active'  // ✅ ONLY ACTIVE OUTLETS
                    }
                });
                
                // ✅ ADD THIS - Sort alphabetically A-Z by outlet_name
                this.outletsData.sort((a, b) => {
                    const nameA = (a.outlet_name || '').toLowerCase();
                    const nameB = (b.outlet_name || '').toLowerCase();
                    return nameA.localeCompare(nameB);
                });
                
                localStorage.setItem(this.CACHE.OUTLETS + distributorId, JSON.stringify(this.outletsData));
                
                this.renderOutlets();
                await this.loadProducts();
                
            } catch (error) {
                console.error('Error loading outlets:', error);
                this.showMessage('Failed to load outlets: ' + error.message, 'error', 'loginMessage');
            }
        }

        // ============================================
        // MODIFICATION: Render Outlets
        // ============================================
        
        renderOutlets() {
            const select = document.getElementById('outletSel');
            const typeButtons = document.getElementById('outletTypeButtons');
            
            // ✅ ENSURE DATA IS SORTED BEFORE RENDERING
            this.outletsData.sort((a, b) => {
                const nameA = (a.outlet_name || '').toLowerCase();
                const nameB = (b.outlet_name || '').toLowerCase();
                return nameA.localeCompare(nameB);
            });
            
            // Get unique outlet types from ACTIVE outlets only
            const types = [...new Set(this.outletsData.map(o => o.outlet_type || 'UNKNOWN'))];
            
            typeButtons.innerHTML = '<button type="button" class="outlet-type-btn active" data-type="ALL" onclick="app.filterOutletsByType(\'ALL\')">All</button>' +
                types.map(t => `<button type="button" class="outlet-type-btn" data-type="${t}" onclick="app.filterOutletsByType('${t}')">${t}</button>`).join('');
            
            select.innerHTML = '<option value="">Choose an outlet...</option>';
            
            // ✅ DROPDOWN WILL BE IN A-Z ORDER BECAUSE DATA IS SORTED
            this.outletsData.forEach(outlet => {
                const option = document.createElement('option');
                option.value = outlet.outlet_id;
                option.dataset.type = outlet.outlet_type;
                option.textContent = `${outlet.outlet_name} - ${outlet.outlet_type}`;
                select.appendChild(option);
            });
        }

        // ============================================
        // MODIFICATION: Filter Outlets by Type
        // ============================================
        
        filterOutletsByType(type) {
            const select = document.getElementById('outletSel');
            const buttons = document.querySelectorAll('.outlet-type-btn');
            
            buttons.forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.type === type) {
                    btn.classList.add('active');
                }
            });
            
            if (type === 'ALL') {
                Array.from(select.options).forEach(option => {
                    option.style.display = '';
                });
                return;
            }
            
            Array.from(select.options).forEach(option => {
                if (option.value && option.dataset.type !== type) {
                    option.style.display = 'none';
                } else {
                    option.style.display = '';
                }
            });
            
            if (select.selectedOptions[0]?.style.display === 'none') {
                select.value = '';
            }
        }

        // ============================================
        // MODIFICATION: Toggle New Outlet
        // ============================================
        
        toggleNewOutlet(isNew) {
            this.isNewOutlet = isNew;
            
            const existingBox = document.getElementById('existingOutletBox');
            const newBox = document.getElementById('newOutletBox');
            const existingBtn = document.getElementById('existingOutletBtn');
            const newBtn = document.getElementById('newOutletBtn');
            
            if (isNew) {
                existingBox.classList.add('hidden');
                newBox.classList.remove('hidden');
                existingBtn.classList.remove('active');
                newBtn.classList.add('active');
                this.handleOutletNameInput();
            } else {
                existingBox.classList.remove('hidden');
                newBox.classList.add('hidden');
                existingBtn.classList.add('active');
                newBtn.classList.remove('active');
            }
        }

        // ============================================
        // MODIFICATION: Handle Outlet Name Input
        // ============================================
        
        handleOutletNameInput() {
            let v = document.getElementById('newOutletName').value;
            v = v.replace(/\b\w/g, c => c.toUpperCase());
            document.getElementById('newOutletName').value = v;
            
            const clean = v.toUpperCase().replace(/[^A-Z0-9]/g, '');
            const outletId = clean ? `${clean.slice(0,6)}-${Math.random().toString(36).substring(2,6).toUpperCase()}` : '';
            document.getElementById('newOutletId').textContent = outletId;
        }

        onOutletChange() {
            const selected = this.outletsData.find(o => o.outlet_id === document.getElementById('outletSel').value);
            document.getElementById('selectedOutletType').value = selected?.outlet_type || '';
        }

        // ============================================
        // MODIFICATION: Load Products (Active only)
        // ============================================
        
        async loadProducts() {
            const container = document.getElementById('productList');
            
            try {
                const cachedProducts = localStorage.getItem(this.CACHE.PRODUCTS);
                if (cachedProducts) {
                    this.productsData = JSON.parse(cachedProducts);
                } else {
                    // CHANGE THIS - Add status=eq.Active filter
                    this.productsData = await supabaseFetch('products', {
                        filters: { 
                            status: 'Active'  // ✅ ONLY ACTIVE PRODUCTS
                        }
                    });
                    localStorage.setItem(this.CACHE.PRODUCTS, JSON.stringify(this.productsData));
                }
                
                // Sort products
                this.productsData.sort((a, b) => (a.product_name || '').localeCompare(b.product_name || ''));
                
                // Mock inventory
                this.productsData.forEach(p => {
                    if (!this.inventory[p.product_id]) {
                        this.inventory[p.product_id] = Math.floor(Math.random() * 50) + 20;
                    }
                });
                
                // Load product types
                const productTypes = [...new Set(this.productsData.map(p => p.product_type).filter(Boolean))].sort();
                
                // Product type filter dropdown
                const typeFilter = document.getElementById('productTypeFilter');
                if (typeFilter) {
                    typeFilter.innerHTML = '<option value="all">All Products</option>';
                    productTypes.forEach(type => {
                        const option = document.createElement('option');
                        option.value = type;
                        option.textContent = type;
                        typeFilter.appendChild(option);
                    });
                }
                
                // Product type tags
                const typeTags = document.getElementById('typeFilters');
                if (typeTags) {
                    typeTags.innerHTML = '<div class="type-tag active" data-type="all" onclick="app.setActiveType(\'all\')">All Types</div>';
                    productTypes.forEach(type => {
                        const tag = document.createElement('div');
                        tag.className = 'type-tag';
                        tag.setAttribute('data-type', type);
                        tag.setAttribute('onclick', `app.setActiveType('${type}')`);
                        tag.textContent = type;
                        typeTags.appendChild(tag);
                    });
                }
                
                this.displayProducts();
                
            } catch (error) {
                console.error('Error loading products:', error);
                if (container) container.innerHTML = '<div class="empty-state">Error loading products</div>';
            }
        }

        // ============================================
        // MODIFICATION: Display Products
        // ============================================
        
        displayProducts() {
            const filterType = document.getElementById('productTypeFilter')?.value || 'all';
            const container = document.getElementById('productList');
            
            if (!container) return;
            
            let filteredProducts = this.productsData;
            if (filterType !== 'all') {
                filteredProducts = this.productsData.filter(p => p.product_type === filterType);
            }
            
            if (filteredProducts.length === 0) {
                container.innerHTML = '<div class="empty-state">No products found</div>';
                return;
            }
            
            container.innerHTML = '';
            
            filteredProducts.forEach(product => {
                const currentQty = this.orderItems[product.product_id]?.qty || 0;
                const stock = this.inventory[product.product_id] || 0;
                
                const div = document.createElement('div');
                div.className = 'product-item';
                div.innerHTML = `
                    <div class="product-info">
                        <div class="product-name">${product.product_name}</div>
                        <div class="product-meta">
                            <span class="product-price">₹${product.case_rate}/case</span>
                            <span class="product-stock">Stock: ${stock}</span>
                            ${product.pack_size ? `<span>${product.pack_size}</span>` : ''}
                        </div>
                    </div>
                    <div class="quantity-controls">
                        <button class="qty-btn" onclick="app.updateQuantity('${product.product_id}', -1)">-</button>
                        <input type="number" id="qty_${product.product_id}" class="qty-input" value="${currentQty}" min="0" max="${stock}" onchange="app.updateQuantityInput('${product.product_id}', this.value)">
                        <button class="qty-btn" onclick="app.updateQuantity('${product.product_id}', 1)">+</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // ============================================
        // MODIFICATION: Filter Products
        // ============================================
        
        filterProductsByType() {
            this.displayProducts();
            this.calculateSummary();
        }

        setActiveType(type) {
            document.querySelectorAll('.type-tag').forEach(t => {
                t.classList.remove('active');
                if (t.dataset.type === type) {
                    t.classList.add('active');
                }
            });
            const typeFilter = document.getElementById('productTypeFilter');
            if (typeFilter) typeFilter.value = type;
            this.displayProducts();
        }

        // ============================================
        // MODIFICATION: Quantity Management
        // ============================================
        
        updateQuantity(productId, delta) {
            const input = document.getElementById(`qty_${productId}`);
            if (!input) return;
            
            let value = parseInt(input.value) || 0;
            value = Math.max(0, value + delta);
            
            const stock = this.inventory[productId] || 0;
            if (value > stock) {
                this.showInventoryWarning(`Only ${stock} units available`);
                value = stock;
            }
            
            input.value = value;
            
            if (value > 0) {
                const product = this.productsData.find(p => p.product_id === productId);
                if (product) {
                    this.orderItems[productId] = {
                        product_id: productId,
                        product_name: product.product_name,
                        qty: value,
                        rate: product.case_rate
                    };
                }
            } else {
                delete this.orderItems[productId];
            }
            
            this.calculateSummary();
        }

        updateQuantityInput(productId, value) {
            const qty = parseInt(value) || 0;
            if (qty >= 0) {
                const stock = this.inventory[productId] || 0;
                if (qty > stock) {
                    this.showInventoryWarning(`Only ${stock} units available`);
                    document.getElementById(`qty_${productId}`).value = stock;
                    return;
                }
                
                if (qty > 0) {
                    const product = this.productsData.find(p => p.product_id === productId);
                    if (product) {
                        this.orderItems[productId] = {
                            product_id: productId,
                            product_name: product.product_name,
                            qty: qty,
                            rate: product.case_rate
                        };
                    }
                } else {
                    delete this.orderItems[productId];
                }
                this.calculateSummary();
            }
        }

        // ============================================
        // MODIFICATION: Calculate Summary
        // ============================================
        
        calculateSummary() {
            let totalItems = 0;
            let totalAmount = 0;
            
            const previewBody = document.getElementById('previewBody');
            
            if (Object.keys(this.orderItems).length === 0) {
                if (previewBody) {
                    previewBody.innerHTML = '<tr><td colspan="3" style="text-align:center; padding:30px; color:#999;">No items added</td></tr>';
                }
                document.getElementById('totalAmount').textContent = '₹0.00';
                return;
            }
            
            let rows = '';
            
            Object.values(this.orderItems).forEach(item => {
                const lineTotal = item.qty * parseFloat(item.rate);
                totalItems += item.qty;
                totalAmount += lineTotal;
                
                rows += `
                    <tr>
                        <td>${item.product_name}</td>
                        <td style="text-align:center;">${item.qty}</td>
                        <td style="text-align:right;">₹${lineTotal.toFixed(2)}</td>
                    </tr>
                `;
            });
            
            if (previewBody) previewBody.innerHTML = rows;
            document.getElementById('totalAmount').textContent = `₹${totalAmount.toFixed(2)}`;
        }

        // ============================================
        // MODIFICATION: Submit Order - USING PROXY
        // ============================================
        
        async submitOrder(mode) {
            // Validate outlet selection/creation
            let outletId;
            
            if (this.isNewOutlet) {
                const name = document.getElementById('newOutletName').value.trim();
                const visitDay = document.getElementById('newOutletVisitDay').value;
                const type = document.getElementById('newOutletType').value;
                const generatedId = document.getElementById('newOutletId').textContent;
                
                if (!name) {
                    this.showMessage('Outlet name is required', 'error');
                    return;
                }
                
                outletId = generatedId || `OUT${Date.now().toString().slice(-8)}-${Math.random().toString(36).substring(2,4).toUpperCase()}`;
                
                try {
                    const newOutlet = {
                        outlet_id: outletId,
                        outlet_name: name,
                        distributor_id: this.currentDistributor.distributor_id,
                        outlet_type: type,
                        status: 'Active',
                        visit_day: visitDay,
                        created_at: new Date().toISOString()
                    };
                    
                    console.log('Creating new outlet:', newOutlet);
                    await supabaseInsert('outlets', newOutlet);
                    console.log('Outlet created successfully:', outletId);
                    
                    localStorage.removeItem(this.CACHE.OUTLETS + this.currentDistributor.distributor_id);
                    
                } catch (error) {
                    console.error('Error creating outlet:', error);
                    this.showMessage('Failed to create outlet: ' + error.message, 'error');
                    return;
                }
                
            } else {  // ✅ CORRECT - else is at the same level as if
                outletId = document.getElementById('outletSel').value;
                if (!outletId) {
                    this.showMessage('Please select an outlet', 'error');
                    return;
                }
            }
            // Validate order items
            if (Object.keys(this.orderItems).length === 0) {
                this.showMessage('Please add at least one product', 'error');
                return;
            }
            
            // Disable buttons
            const draftBtn = document.getElementById('draftBtn');
            const submitBtn = document.getElementById('submitBtn');
            if (draftBtn) draftBtn.disabled = true;
            if (submitBtn) submitBtn.disabled = true;
            
            try {
                // Get user_id from users table by email
                let userId = this.currentDistributor.distributor_id; // Default fallback
                
                try {
                    // CHANGED: Using supabaseFetch instead of direct fetch
                    const users = await supabaseFetch('users', {
                        filters: { email_id: this.currentUser.email }
                    });
                    
                    if (users && users.length > 0) {
                        userId = users[0].employee_id;
                        console.log('Found user_id:', userId);
                    }
                } catch (e) {
                    console.log('User fetch failed, using distributor_id');
                }
                
                // Generate order number
                const orderNumber = `ORD-${Date.now()}`;
                
                // Prepare order items array
                const itemsArray = Object.values(this.orderItems).map(item => ({
                    product_id: item.product_id,
                    product_name: item.product_name,
                    qty: item.qty,
                    rate: item.rate
                }));
                
                // Create order with exact field mapping
                const orderData = {
                    order_number: orderNumber,
                    user_id: userId,
                    distributor_id: this.currentDistributor.distributor_id,
                    outlet_id: outletId,
                    comment: document.getElementById('commentBox').value || null,
                    fulfillment_type: document.getElementById('fulfillmentSel').value,
                    order_status: mode === 'draft' ? 'Draft' : 'Pending',
                    created_by_email: this.currentUser.email,
                    items: itemsArray
                };
                
                console.log('Submitting order:', orderData);
                
                // CHANGED: Using supabaseInsert instead of direct fetch
                const orders = await supabaseInsert('orders', orderData);
                const order = orders[0];
                
                console.log('Order created:', order);
                
                // Insert order items into order_items table
                for (const item of Object.values(this.orderItems)) {
                    const orderItemData = {
                        order_id: order.id,
                        product_id: item.product_id,
                        qty: item.qty,
                        rate: item.rate
                    };
                    
                    console.log('Inserting order item:', orderItemData);
                    
                    // CHANGED: Using supabaseInsert instead of direct fetch
                    await supabaseInsert('order_items', orderItemData);
                }
                
                // Success message
                this.showMessage(`✅ Order ${orderNumber} ${mode === 'draft' ? 'saved as draft' : 'submitted successfully'}!`, 'success');
                
                // Clear form if submitted
                if (mode === 'submit') {
                    this.clearForm();
                    
                    // If new outlet was created, refresh outlets and select it
                    if (this.isNewOutlet) {
                        // Fetch updated outlets
                        // CHANGED: Using supabaseFetch instead of direct fetch
                        this.outletsData = await supabaseFetch('outlets', {
                            filters: {
                                distributor_id: this.currentDistributor.distributor_id,
                                status: 'Active'
                            }
                        });
                        
                        this.outletsData.sort((a, b) => (a.outlet_name || '').localeCompare(b.outlet_name || ''));
                        localStorage.setItem(this.CACHE.OUTLETS + this.currentDistributor.distributor_id, JSON.stringify(this.outletsData));
                        this.renderOutlets();
                        
                        // Switch back to existing outlet view and select the new outlet
                        this.toggleNewOutlet(false);
                        const outletSelect = document.getElementById('outletSel');
                        if (outletSelect) outletSelect.value = outletId;
                        
                        // Update outlet type display
                        const newOutlet = this.outletsData.find(o => o.outlet_id === outletId);
                        if (newOutlet) {
                            document.getElementById('selectedOutletType').value = newOutlet.outlet_type;
                        }
                    }
                }
                
            } catch (error) {
                console.error('Error submitting order:', error);
                this.showMessage('Error: ' + error.message, 'error');
            } finally {
                if (draftBtn) draftBtn.disabled = false;
                if (submitBtn) submitBtn.disabled = false;
            }
        }

        // ============================================
        // MODIFICATION: Clear Form
        // ============================================
        
        clearForm() {
            this.orderItems = {};
            document.querySelectorAll('.qty-input').forEach(input => {
                input.value = 0;
            });
            const commentBox = document.getElementById('commentBox');
            if (commentBox) commentBox.value = '';
            this.calculateSummary();
            
            // Clear new outlet form if visible
            if (this.isNewOutlet) {
                const newOutletName = document.getElementById('newOutletName');
                const newOutletLocation = document.getElementById('newOutletLocation');
                const newOutletId = document.getElementById('newOutletId');
                const newOutletVisitDay = document.getElementById('newOutletVisitDay');
                const newOutletType = document.getElementById('newOutletType');
                
                if (newOutletName) newOutletName.value = '';
                if (newOutletLocation) newOutletLocation.value = '';
                if (newOutletId) newOutletId.textContent = '';
                if (newOutletVisitDay) newOutletVisitDay.value = 'Monday';
                if (newOutletType) newOutletType.value = 'HVO';
            }
            
            this.displayProducts();
        }

        // ============================================
        // MODIFICATION: Show Message
        // ============================================
        
        showMessage(text, type, elementId = 'successMessage') {
            const msg = document.getElementById(elementId);
            if (msg) {
                msg.textContent = text;
                msg.className = `message ${type} show`;
                
                setTimeout(() => {
                    msg.classList.remove('show');
                }, 5000);
            } else {
                alert(text);
            }
        }

        showInventoryWarning(message) {
            alert(message);
        }

        // ============================================
        // MODIFICATION: Logout
        // ============================================
        
        handleLogout() {
            localStorage.removeItem(this.CACHE.USER);
            localStorage.removeItem(this.CACHE.LAST_DISTRIBUTOR);
            this.currentUser = null;
            this.currentDistributor = null;
            this.distributorsList = [];
            this.orderItems = {};
            
            const userEmail = document.getElementById('userEmail');
            const logoutBtn = document.getElementById('logoutBtn');
            const orderSection = document.getElementById('orderSection');
            const loginSection = document.getElementById('loginSection');
            const distributorSection = document.getElementById('distributorSection');
            const email = document.getElementById('email');
            
            if (userEmail) userEmail.textContent = '';
            if (logoutBtn) logoutBtn.style.display = 'none';
            if (orderSection) orderSection.style.display = 'none';
            if (loginSection) loginSection.style.display = 'block';
            if (distributorSection) distributorSection.style.display = 'none';
            if (email) email.value = 'nikhil@toyokombucha.com';
            
            this.showMessage('Logged out successfully', 'success', 'loginMessage');
        }
    }

    // ============================================
    // Initialize App
    // ============================================
    
    const app = new K95OrderApp();
    window.app = app;
</script>
</body>
</html>
