    getItem(key) {
        const remember = localStorage.getItem(REMEMBER_ME_KEY) !== 'false';
        return remember ? localStorage.getItem(key) : sessionStorage.getItem(key);
    },
    setItem(key, value) {
        const remember = localStorage.getItem(REMEMBER_ME_KEY) !== 'false';
        const primary = remember ? localStorage : sessionStorage;
        const secondary = remember ? sessionStorage : localStorage;
        primary.setItem(key, value);
        secondary.removeItem(key);
    },
    removeItem(key) {
        localStorage.removeItem(key);
        sessionStorage.removeItem(key);
    }
};

        },

            fetch: async (url, options) => {
                const parsedUrl = new URL(url);
                const path = parsedUrl.pathname;
                const isAuth = path.startsWith('/auth/v1/');
                const isStorage = path.startsWith('/storage/v1/');
                const type = isAuth ? 'auth' : isStorage ? 'storage' : 'rest';
                const prefix = isAuth ? '/auth/v1/' : isStorage ? '/storage/v1/' : '/rest/v1/';
                const apiPath = path.replace(prefix, '');
                const proxyUrl = new URL('proxy.php', window.location.href);

                proxyUrl.searchParams.set('path', apiPath);

let deferredPrompt;
const installButton = document.getElementById('installAppBtn');
const installIconBtn = document.getElementById('installIconBtn');

// Listen for the beforeinstallprompt event
window.addEventListener('beforeinstallprompt', (e) => {
  // Don't prevent default if you want the banner
  // e.preventDefault();  // ✅ Comment this out to allow banner
  deferredPrompt = e;
  installButton.style.display = 'block';
  installIconBtn.style.display = 'flex';
  console.log('App is installable!');
});

// Handle button click for both buttons
function handleInstallClick() {
  if (!deferredPrompt) {
    // If no deferred prompt, maybe show instructions for iOS
    showIOSInstructions();
    return;
  }
  
  // Show the install prompt
  deferredPrompt.prompt();
  
  // Wait for user's choice
  deferredPrompt.choice.then(({ outcome }) => {
    console.log(`User response to install: ${outcome}`);
    // Reset
    deferredPrompt = null;
    installButton.style.display = 'none';
    installIconBtn.style.display = 'none';
  });
}

installButton.addEventListener('click', handleInstallClick);
installIconBtn.addEventListener('click', handleInstallClick);

// App was successfully installed
window.addEventListener('appinstalled', () => {
  console.log('PWA was installed');
  installButton.style.display = 'none';
  installIconBtn.style.display = 'none';
  deferredPrompt = null;
});

// iOS/Safari fallback (since beforeinstallprompt doesn't work on iOS)
function showIOSInstructions() {
  // Check if iOS
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  if (isIOS) {
    alert('To install this app on iOS: Tap Share icon → Add to Home Screen');
  }
}

// Check if already in standalone mode (app already installed)
if (window.matchMedia('(display-mode: standalone)').matches) {
  console.log('App is already installed');
  installButton.style.display = 'none';
  installIconBtn.style.display = 'none';
}

function showConfirmDialog(message, onConfirm) {
    const dialog = document.createElement('div');
    dialog.className = 'confirm-dialog';
    dialog.innerHTML = `
        <div class="confirm-content">
            <i class="fas fa-shield-alt"></i>
            <h3>Confirm Action</h3>
            <p>${message}</p>
            <div class="confirm-buttons">
                <button class="confirm-btn secondary" id="cancelBtn">Cancel</button>
                <button class="confirm-btn primary" id="confirmBtn">Continue</button>
            </div>
        </div>
    `;
    document.body.appendChild(dialog);
    
    document.getElementById('cancelBtn').addEventListener('click', () => {
        document.body.removeChild(dialog);
    });
    
    document.getElementById('confirmBtn').addEventListener('click', () => {
        document.body.removeChild(dialog);
        onConfirm();
    });
}

function isValidEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

function setButtonBusy(button, busy, busyText) {
    if (!button) return;
    if (!button.dataset.defaultText) button.dataset.defaultText = button.textContent;
    button.disabled = busy;
    button.textContent = busy ? busyText : button.dataset.defaultText;
}

function showAuthForm(form) {
    [loginForm, signupForm, forgotForm, resetForm].forEach(item => {
        item.style.display = item === form ? 'block' : 'none';
    });
}

async function handleLogin(event) {
    event?.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    if (!email || !password) return showError('Email and password required');
    if (!isValidEmail(email)) return showError('Please enter a valid email address');

    const button = document.getElementById('loginBtn');
    localStorage.setItem(REMEMBER_ME_KEY, String(rememberMe.checked));
    if (rememberMe.checked) {
        localStorage.setItem(REMEMBERED_EMAIL_KEY, email);
    } else {
        localStorage.removeItem(REMEMBERED_EMAIL_KEY);
    }
    clearMessages();
    setButtonBusy(button, true, 'Signing in…');
    try {
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;
        document.getElementById('loginPassword').value = '';
    } catch (error) {
        showError(error.message || 'Unable to sign in. Please try again.');
    } finally {
        setButtonBusy(button, false);
    }
}

async function handleSignup(event) {
    event?.preventDefault();
    const name = document.getElementById('signupName').value.trim();
    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;
    if (!name || !email || !password) return showError('All fields required');
    if (!isValidEmail(email)) return showError('Please enter a valid email address');
    if (password.length < 6) return showError('Password must be at least 6 characters');

    const button = document.getElementById('signupBtn');
    clearMessages();
    setButtonBusy(button, true, 'Creating account…');
    try {
        const { data, error } = await supabaseClient.auth.signUp({
            email,
            password,
            options: { data: { full_name: name } }
        });
        if (error) throw error;

        document.getElementById('signupPassword').value = '';
        if (!data.session) {
            showAuthForm(loginForm);
            document.getElementById('loginEmail').value = email;
            showSuccess('Account created. Check your email to confirm your account, then sign in.');
        }
    } catch (error) {
        showError(error.message || 'Unable to create the account. Please try again.');
    } finally {
        setButtonBusy(button, false);
    }
}

async function handleForgot(event) {
    event?.preventDefault();
    const email = document.getElementById('forgotEmail').value.trim();
    if (!email) return showError('Email required');
    if (!isValidEmail(email)) return showError('Please enter a valid email address');

    const button = document.getElementById('forgotBtn');
    clearMessages();
    setButtonBusy(button, true, 'Sending…');
    try {
        const redirectTo = new URL('/salesk95/index.html', window.location.origin).toString();
        const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo });
        if (error) throw error;
        showSuccess('If an account exists for this email, a password reset link has been sent.');
    } catch (error) {
        showError(error.message || 'Unable to send the reset link. Please try again.');
    } finally {
        setButtonBusy(button, false);
    }
}

async function handlePasswordReset(event) {
    event?.preventDefault();
    const password = document.getElementById('resetPassword').value;
    const confirmation = document.getElementById('resetPasswordConfirm').value;
    if (password.length < 6) return showError('Password must be at least 6 characters');
    if (password !== confirmation) return showError('Passwords do not match');

    const button = document.getElementById('resetBtn');
    clearMessages();
    setButtonBusy(button, true, 'Updating…');
    try {
        const { error } = await supabaseClient.auth.updateUser({ password });
        if (error) throw error;
        passwordRecoveryMode = false;
        await supabaseClient.auth.signOut();
        showAuthForm(loginForm);
        showSuccess('Password updated successfully. You can now sign in.');
    } catch (error) {
        showError(error.message || 'Unable to update the password. Please request a new reset link.');
    } finally {
        setButtonBusy(button, false);
    }
}

// Attach event listeners
loginForm.addEventListener('submit', handleLogin);

async function fetchUserAccess(email) {
    const { data: { session } } = await supabaseClient.auth.getSession();
    const token = session?.access_token;

    const proxyUrl = new URL('proxy.php', window.location.href);
    proxyUrl.searchParams.set('type', 'rest');
    proxyUrl.searchParams.set('path', 'access_manager');
    proxyUrl.searchParams.set('select', '*');
    proxyUrl.searchParams.set('user_email', `eq.${email}`);

    const res = await fetch(proxyUrl.toString(), {
        headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${token}`
        }
    });

    if (!res.ok) {
        throw new Error(`HTTP error ${res.status}`);
    }

    const data = await res.json();
    return data[0] || null;
}

// ============================================
// PROFILE MODAL FUNCTIONALITY
// ============================================
let currentUserAccess = null;
let currentUser = null;
const PROFILE_PHOTO_BUCKET = 'profile-photos';

function escapeHtml(value) {
    return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
}

function profileInitials(name) {
    return String(name || 'K95')
        .trim()
        .split(/\s+/)
        .map(part => part[0])
        .join('')
        .toUpperCase()
        .slice(0, 2) || 'K9';
}

function safeProfilePhotoUrl(value) {
    if (!value) return '';
    try {
        const url = new URL(value);
        return url.protocol === 'https:' || url.protocol === 'http:' ? url.toString() : '';
    } catch {
        return '';
    }
}

function renderProfilePhoto(container, avatarUrl, initials, altText = 'Profile photo') {
    if (!container) return;
    const safeUrl = safeProfilePhotoUrl(avatarUrl);
    container.replaceChildren();
    if (safeUrl) {
        const image = new Image();
        image.src = safeUrl;
        image.alt = altText;
        image.referrerPolicy = 'no-referrer';
        image.addEventListener('error', () => {
            container.replaceChildren(document.createTextNode(initials));
        }, { once: true });
        container.appendChild(image);
    } else {
        container.textContent = initials;
    }
}

function applyCurrentProfilePhoto() {
    const name = currentUserAccess?.full_name || currentUser?.user_metadata?.full_name || currentUser?.email || 'K95';
    const initials = profileInitials(name);
    renderProfilePhoto(document.getElementById('profileAvatar'), currentUserAccess?.avatar_url, initials, `${name} profile photo`);
    renderProfilePhoto(document.getElementById('profilePhotoPreview'), currentUserAccess?.avatar_url, initials, `${name} profile photo`);
}

function setProfileUploadStatus(message, isError = false) {
    const status = document.getElementById('profileUploadStatus');
    if (!status) return;
    status.textContent = message;
    status.style.color = isError ? '#ff3b30' : '#6e7786';
}

function compressProfilePhoto(file) {
    return new Promise((resolve, reject) => {
        if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
            reject(new Error('Choose a JPEG, PNG, or WebP image.'));
            return;
        }
        if (file.size > 10 * 1024 * 1024) {
            reject(new Error('The original image must be smaller than 10 MB.'));
            return;
        }

        const objectUrl = URL.createObjectURL(file);
        const image = new Image();
        image.onload = () => {
            try {
                const size = Math.min(image.naturalWidth, image.naturalHeight);
                const sourceX = (image.naturalWidth - size) / 2;
                const sourceY = (image.naturalHeight - size) / 2;
                const canvas = document.createElement('canvas');
                canvas.width = 320;
                canvas.height = 320;
                const context = canvas.getContext('2d', { alpha: false });
                context.fillStyle = '#ffffff';
                context.fillRect(0, 0, 320, 320);
                context.drawImage(image, sourceX, sourceY, size, size, 0, 0, 320, 320);
                canvas.toBlob(blob => {
                    URL.revokeObjectURL(objectUrl);
                    if (!blob) {
                        reject(new Error('Unable to process this image.'));
                        return;
                    }
                    resolve(blob);
                }, 'image/webp', 0.82);
            } catch (error) {
                URL.revokeObjectURL(objectUrl);
                reject(error);
            }
        };
        image.onerror = () => {
            URL.revokeObjectURL(objectUrl);
            reject(new Error('Unable to read this image.'));
        };
        image.src = objectUrl;
    });
}

function storagePathFromPublicUrl(value) {
    const safeUrl = safeProfilePhotoUrl(value);
    if (!safeUrl) return '';
    const marker = `/storage/v1/object/public/${PROFILE_PHOTO_BUCKET}/`;
    const pathname = new URL(safeUrl).pathname;
    const index = pathname.indexOf(marker);
    return index === -1 ? '' : decodeURIComponent(pathname.slice(index + marker.length));
}

async function uploadProfilePhoto(file) {
    if (!currentUser || !currentUserAccess) return;
    const uploadButton = document.getElementById('profilePhotoUploadButton');
    const removeButton = document.getElementById('profilePhotoRemoveButton');
    uploadButton.disabled = true;
    removeButton.disabled = true;
    setProfileUploadStatus('Preparing photo…');

    let uploadedPath = '';
    try {
        const compressed = await compressProfilePhoto(file);
        const outputType = ['image/webp', 'image/jpeg', 'image/png'].includes(compressed.type)
            ? compressed.type
            : 'image/jpeg';
        const extension = { 'image/webp': 'webp', 'image/png': 'png' }[outputType] || 'jpg';
        uploadedPath = `${currentUser.id}/avatar-${Date.now()}.${extension}`;
        setProfileUploadStatus('Uploading photo…');

        const { error: uploadError } = await supabaseClient.storage
            .from(PROFILE_PHOTO_BUCKET)
            .upload(uploadedPath, compressed, {
                contentType: outputType,
                cacheControl: '3600',
                upsert: false
            });
        if (uploadError) throw uploadError;

        const { data: publicData } = supabaseClient.storage
            .from(PROFILE_PHOTO_BUCKET)
            .getPublicUrl(uploadedPath);
        const avatarUrl = `${publicData.publicUrl}?v=${Date.now()}`;
        const previousPath = storagePathFromPublicUrl(currentUserAccess.avatar_url);

        const { error: updateError } = await supabaseClient
            .from('access_manager')
            .update({ avatar_url: avatarUrl, updated_at: new Date().toISOString() })
            .eq('user_email', currentUser.email);
        if (updateError) throw updateError;

        currentUserAccess.avatar_url = avatarUrl;
        applyCurrentProfilePhoto();
        uploadButton.innerHTML = '<i class="fas fa-camera"></i> Replace';
        removeButton.disabled = false;
        setProfileUploadStatus('Profile photo updated.');

        if (previousPath && previousPath !== uploadedPath) {
            supabaseClient.storage.from(PROFILE_PHOTO_BUCKET).remove([previousPath])
                .catch(error => console.warn('Old profile photo cleanup failed:', error));
        }
    } catch (error) {
        if (uploadedPath) {
            supabaseClient.storage.from(PROFILE_PHOTO_BUCKET).remove([uploadedPath])
                .catch(() => {});
        }
        const rawMessage = String(error.message || '');
        const message = rawMessage.toLowerCase().includes('row-level security')
            ? 'Profile photo upload permission is missing in Supabase Storage.'
            : rawMessage || 'Unable to upload the profile photo.';
        setProfileUploadStatus(message, true);
    } finally {
        uploadButton.disabled = false;
        removeButton.disabled = !currentUserAccess?.avatar_url;
        document.getElementById('profilePhotoInput').value = '';
    }
}

async function removeProfilePhoto() {
    if (!currentUserAccess?.avatar_url || !currentUser) return;
    const oldPath = storagePathFromPublicUrl(currentUserAccess.avatar_url);
    const uploadButton = document.getElementById('profilePhotoUploadButton');
    const removeButton = document.getElementById('profilePhotoRemoveButton');
    uploadButton.disabled = true;
    removeButton.disabled = true;
    setProfileUploadStatus('Removing photo…');

    try {
        const { error } = await supabaseClient
            .from('access_manager')
            .update({ avatar_url: null, updated_at: new Date().toISOString() })
            .eq('user_email', currentUser.email);
        if (error) throw error;

        currentUserAccess.avatar_url = null;
        applyCurrentProfilePhoto();
        uploadButton.innerHTML = '<i class="fas fa-camera"></i> Add photo';
        setProfileUploadStatus('Profile photo removed.');
        if (oldPath) {
            supabaseClient.storage.from(PROFILE_PHOTO_BUCKET).remove([oldPath])
                .catch(error => console.warn('Profile photo cleanup failed:', error));
        }
    } catch (error) {
        setProfileUploadStatus(error.message || 'Unable to remove the profile photo.', true);
    } finally {
        uploadButton.disabled = false;
        removeButton.disabled = !currentUserAccess?.avatar_url;
    }
}

// Function to show profile modal
async function showProfileModal() {
    const modal = document.getElementById('profileModal');
    const profileDetails = document.getElementById('profileDetails');
    
    // Show loading
    profileDetails.innerHTML = '<div class="loading-spinner"><div class="spinner"></div></div>';
    modal.style.display = 'flex';
    
    try {
        // Get current session
        const { data: { session } } = await supabaseClient.auth.getSession();
        currentUser = session?.user;
        
        if (!currentUser) {
            profileDetails.innerHTML = '<p class="no-tiles-message">No user data available</p>';
            return;
        }
        
        currentUserAccess = await fetchUserAccess(currentUser.email);
        if (!currentUserAccess) {
            profileDetails.innerHTML = '<p class="no-tiles-message">No profile record has been assigned to this account.</p>';
            return;
        }
        
        // Build profile HTML
        let permissionsHtml = '';
        if (currentUserAccess?.tile_permissions) {
            const tiles = Object.entries(currentUserAccess.tile_permissions);
            permissionsHtml = tiles.map(([key, value]) => 
                `<span class="tile-permission-badge">${escapeHtml(key)}: ${escapeHtml(value.access)}</span>`
            ).join('');
        }
        
        const distributorIds = currentUserAccess?.distributor_ids || [];
        const distributorHtml = distributorIds.length > 0 
            ? distributorIds.map(id => `<span class="distributor-tag">${escapeHtml(id)}</span>`).join('')
            : '<span class="field-value">No distributors assigned</span>';

        const fullName = currentUserAccess.full_name || currentUser.user_metadata?.full_name || currentUser.email;
        const hasPhoto = Boolean(safeProfilePhotoUrl(currentUserAccess.avatar_url));
        
        profileDetails.innerHTML = `
            <div class="profile-photo-editor">
                <div class="profile-photo-preview" id="profilePhotoPreview"></div>
                <div class="profile-photo-actions">
                    <input type="file" id="profilePhotoInput" accept="image/jpeg,image/png,image/webp" hidden>
                    <button type="button" class="profile-photo-button" id="profilePhotoUploadButton">
                        <i class="fas fa-camera"></i> ${hasPhoto ? 'Replace' : 'Add photo'}
                    </button>
                    <button type="button" class="profile-photo-button remove" id="profilePhotoRemoveButton" ${hasPhoto ? '' : 'disabled'}>
                        <i class="fas fa-trash-alt"></i> Remove
                    </button>
                </div>
                <div class="profile-upload-status" id="profileUploadStatus">JPEG, PNG or WebP · compressed to 320 × 320</div>
            </div>
            <div class="profile-fields-card">
                <div class="profile-field">
                    <div class="field-label">Full Name</div>
                    <div class="field-value">${escapeHtml(fullName || 'Not set')}</div>
                </div>
                <div class="profile-field">
                    <div class="field-label">Email ID</div>
                    <div class="field-value">${escapeHtml(currentUser.email)}</div>
                </div>
                <div class="profile-field">
                    <div class="field-label">Role Name</div>
                    <div class="field-value">${escapeHtml(currentUserAccess.role_name ? currentUserAccess.role_name.toUpperCase() : 'Not assigned')}</div>
                </div>
                <div class="profile-field">
                    <div class="field-label">Distributor IDs</div>
                    <div class="distributor-tags">${distributorHtml}</div>
                </div>
                <div class="profile-field">
                    <div class="field-label">Tile Access Permissions</div>
                    <div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;">${permissionsHtml || '<span class="field-value">No permissions configured</span>'}</div>
                </div>
            </div>
        `;
        applyCurrentProfilePhoto();
        document.getElementById('profilePhotoUploadButton').addEventListener('click', () => {
            document.getElementById('profilePhotoInput').click();
        });
        document.getElementById('profilePhotoInput').addEventListener('change', event => {
            const file = event.target.files?.[0];
            if (file) uploadProfilePhoto(file);
        });
        document.getElementById('profilePhotoRemoveButton').addEventListener('click', removeProfilePhoto);
    } catch (error) {
        console.error('Error loading profile:', error);
        profileDetails.innerHTML = '<p class="no-tiles-message">Error loading profile details</p>';
    }
}

// SIDEBAR CREATION
// ============================================
function createSidebar(access) {
    const permissions = access.tile_permissions || {};
    const isAdmin = String(access.role_name || '').toLowerCase() === 'admin';
    
    const overlay = document.createElement('div');
    overlay.className = 'sidebar-overlay';
    overlay.id = 'sidebarOverlay';
    
    const sidebar = document.createElement('div');
    sidebar.className = 'sidebar';
    sidebar.id = 'sidebar';
    
    sidebar.innerHTML = `
        <div class="sidebar-header">
            <h3>K95 Foods</h3>
            <p>Sales Navigation</p>
        </div>
        <div class="sidebar-menu" id="sidebarMenu"></div>
        <div class="sidebar-footer">
            <div class="sidebar-item" id="sidebarLogout">
                <i class="fas fa-sign-out-alt"></i>
                <span>Sign Out</span>
            </div>
        </div>
    `;
    
    overlay.appendChild(sidebar);
    document.body.appendChild(overlay);
    
    // Add menu items
    const menuContainer = document.getElementById('sidebarMenu');
    ALL_TILES.forEach(tile => {
        const perm = getTilePermission(permissions, tile.id);
        const unavailable = perm.access === 'none';
        if (unavailable && !isAdmin) return;
        
        const item = document.createElement('div');
        item.className = `sidebar-item${unavailable ? ' unavailable' : ''}`;
        if (!unavailable) item.dataset.path = tile.path;
        if (unavailable) item.setAttribute('aria-disabled', 'true');
        item.innerHTML = `
            <i class="fas ${tile.icon}"></i>
            <span class="sidebar-label">${tile.name}</span>
            ${unavailable ? '<span class="sidebar-badge">Unavailable</span>' : ''}
        `;
        if (!unavailable) {
            item.addEventListener('click', () => {
                if (item.dataset.path) window.location.href = item.dataset.path;
                toggleSidebar();
            });
        }
        menuContainer.appendChild(item);
    });
    
    // Close when clicking overlay
    overlay.addEventListener('click', (e) => {
        if (e.target === overlay) toggleSidebar();
    });
    
    // Logout from sidebar
    document.getElementById('sidebarLogout').addEventListener('click', () => {
        toggleSidebar();
        supabaseClient.auth.signOut();
    });
}

function toggleSidebar() {
    const overlay = document.getElementById('sidebarOverlay');
    const sidebar = document.getElementById('sidebar');
    
    if (overlay.style.display === 'flex') {
        overlay.style.display = 'none';
        sidebar.classList.remove('open');
    } else {
        overlay.style.display = 'flex';
        sidebar.classList.add('open');
    }
}

// ============================================
// RENDER TILES
// ============================================
function getTilePermission(permissions, tileId) {
    if (tileId === 'daily_attendance') {
        const daily = permissions.daily_attendance;
        const report = permissions.attendance_report;
        if (daily?.access && daily.access !== 'none') return daily;
        if (report?.access && report.access !== 'none') return report;
    }
    return permissions[tileId] || { access:'none', export:false };
}

function renderTiles(access) {
    const permissions = access.tile_permissions || {};
    const tilesContainer = document.getElementById('tilesContainer');
    const quickActionsContainer = document.getElementById('quickActions');

    const allowedTiles = ALL_TILES.filter(tile => {
        const permission = getTilePermission(permissions, tile.id);
        return permission.access !== 'none';
    });

    let tilesHtml = '';
    allowedTiles.forEach(tile => {
        const perm = getTilePermission(permissions, tile.id);
        tilesHtml += `
            <div class="tile" data-path="${tile.path}">
                <i class="fas ${tile.icon}"></i>
                <div class="title">${tile.name}</div>
            </div>
        `;
    });
    tilesContainer.innerHTML = tilesHtml || '<div class="no-tiles-message">No modules are assigned to this account.</div>';

    let quickHtml = '';
    QUICK_ACTION_IDS.forEach(id => {
        const tile = ALL_TILES.find(t => t.id === id);
        if (!tile) return;
        const perm = getTilePermission(permissions, tile.id);
        if (perm.access === 'none') return;
        quickHtml += `
            <div class="quick-action" data-path="${tile.path}">
                <i class="fas ${tile.icon}"></i>
                <span>${tile.name.split(' ')[0]}</span>
            </div>
        `;
    });
    quickActionsContainer.innerHTML = quickHtml;
    quickActionsContainer.style.display = quickHtml ? 'flex' : 'none';

    document.querySelectorAll('.tile, .quick-action').forEach(el => {
        el.addEventListener('click', () => {
            const path = el.dataset.path;
            if (path) window.location.href = path;
        });
    });
}

// ============================================
// RENDER DASHBOARD
// ============================================
async function renderDashboard(user) {
    document.getElementById('tilesContainer').innerHTML = '<div class="loading-spinner"><div class="spinner"></div></div>';

    try {
        const access = await fetchUserAccess(user.email);
        currentUser = user;
        currentUserAccess = access;

        const suspendedUntil = access?.tile_permissions?.account_control?.suspended_until;
        if (suspendedUntil && new Date(suspendedUntil) > new Date()) {
            const untilText = new Date(suspendedUntil).toLocaleString('en-IN', {
                timeZone: 'Asia/Kolkata', hour12: true, dateStyle: 'medium', timeStyle: 'short'
            });
            const reason = access.tile_permissions.account_control.suspension_reason;
            document.getElementById('tilesContainer').innerHTML = `<div class="no-tiles-message">Account suspended until ${escapeHtml(untilText)}${reason ? `<br>${escapeHtml(reason)}` : ''}</div>`;
            await supabaseClient.auth.signOut();
            setTimeout(() => window.location.reload(), 2500);
            return;
        }
        
        // Rebuild navigation for the current user's latest permissions.
        document.getElementById('sidebarOverlay')?.remove();
        createSidebar(access || { tile_permissions: {} });
        
        if (!access) {
            document.getElementById('profileName').textContent = user.user_metadata?.full_name || user.email;
            document.getElementById('profileRole').textContent = 'No role assigned';
            applyCurrentProfilePhoto();
            renderTiles({ tile_permissions: {} });
            return;
        }

        // Get initials for avatar
        const fullName = access.full_name || user.email;
        const initials = fullName.split(' ').map(n => n[0]).join('').toUpperCase().slice(0,2);
        document.getElementById('profileAvatar').textContent = initials;
        document.getElementById('profileName').textContent = fullName;
        document.getElementById('profileRole').textContent = access.role_name ? access.role_name.toUpperCase() : '';
        applyCurrentProfilePhoto();
        
        renderTiles(access);
    } catch (err) {
        console.error('RenderDashboard error:', err);
        document.getElementById('tilesContainer').innerHTML = '<div class="no-tiles-message">Error loading data. Please try again.</div>';
    }
}

// ============================================
// SESSION MANAGEMENT
// ============================================
let passwordRecoveryMode = false;

supabaseClient.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY') {
        passwordRecoveryMode = true;
        authView.style.display = 'block';
        dashboardView.style.display = 'none';
        showAuthForm(resetForm);
        clearMessages();
        showSuccess('Enter and confirm your new password.');
    } else if ((event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') && !passwordRecoveryMode) {
        authView.style.display = 'none';
        dashboardView.style.display = 'block';
        renderDashboard(session.user);
    } else if (event === 'SIGNED_OUT') {
        authView.style.display = 'block';
        dashboardView.style.display = 'none';
        showAuthForm(loginForm);
    }
});

supabaseClient.auth.getSession().then(({ data: { session } }) => {
    if (session && !passwordRecoveryMode) {
        authView.style.display = 'none';
        dashboardView.style.display = 'block';
        renderDashboard(session.user);
    } else {
        authView.style.display = 'block';
        dashboardView.style.display = 'none';
    }
}).catch(err => {
    console.error('getSession error:', err);
});

// MENU BUTTON HANDLER
// ============================================
document.addEventListener('click', function(e) {
    if (e.target.closest('#menuBtn') || e.target.closest('.fa-bars')) {
        toggleSidebar();
    }
});
