<!doctype html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>K95 Foods Outlet Stock Form</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --primary-black:#121212;
      --light-black:#1a1a1a;
      --accent-yellow:#FFD700;
      --dark-yellow:#E6C300;
      --pure-white:#fff;
      --gray-light:#E8E9EA;
      --border-radius:12px;
      --card-shadow:0 2px 8px rgba(0,0,0,.28);
      
      --toyo-low-sugar-color: rgba(255, 87, 34, 0.15);
      --toyo-zero-sugar-color: rgba(33, 150, 243, 0.15);
      --good-trip-color: rgba(76, 175, 80, 0.15);
      --pop-edition-color: rgba(156, 39, 176, 0.15);
      --other-type-color: rgba(158, 158, 158, 0.15);
      --default-type-color: rgba(255, 193, 7, 0.15);
    }

    *{box-sizing:border-box}
    html,body{
      margin:0;padding:0;width:100%;
      background:linear-gradient(135deg,var(--primary-black),var(--light-black));
      color:#fff;font-family:system-ui;font-size:16px;
      -webkit-text-size-adjust: 100%;
    }

    input, select, textarea { font-size: 16px !important; }

    .wrap{max-width:1080px;margin:auto;padding:20px 16px 40px}
    .header{display:flex;gap:12px;margin-bottom:24px}
    .logo-icon{width:36px;height:36px;background:var(--accent-yellow);border-radius:10px;
      display:grid;place-items:center;color:#000;font-weight:800;}

    h1{margin:0;font-size:20px;background:linear-gradient(90deg,#fff,var(--accent-yellow));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;}

    .card{background:var(--light-black);border-radius:var(--border-radius);
      padding:18px;margin-bottom:16px;box-shadow:var(--card-shadow);}

    .card-title{font-size:16px;font-weight:600;margin-bottom:16px;display:flex;gap:8px}
    .card-title::before{content:"";width:4px;height:16px;background:var(--accent-yellow);}

    label{font-size:13px;color:var(--gray-light);display:block;margin:10px 0 6px;}

    select,input,textarea{
      width:100%;background:#000;border:1px solid rgba(255,255,255,.1);
      border-radius:10px;padding:18px 16px;font-size:18px;font-weight:600;color:#fff;
      -webkit-appearance: none;-moz-appearance: none;appearance: none;
    }
    
    select {
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
      background-repeat: no-repeat;background-position: right 16px center;background-size: 20px;
      padding-right: 50px;
    }

    /* FILTERS */
    .filter-section {margin-bottom: 20px;}
    .filter-label {font-size: 14px;font-weight: 600;color: var(--accent-yellow);margin-bottom: 8px;}
    .type-filters {display: flex;flex-wrap: wrap;gap: 8px;}
    
    .type-tag {
      padding: 10px 16px;border-radius: 8px;font-size: 14px;font-weight: 600;
      cursor: pointer;transition: all 0.3s ease;-webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .type-tag.active {transform: scale(1.05);box-shadow: 0 0 0 2px var(--accent-yellow);}

    .type-tag.toyo-low-sugar {background: var(--toyo-low-sugar-color);color: #ff5722;border: 1px solid rgba(255, 87, 34, 0.3);}
    .type-tag.toyo-zero-sugar {background: var(--toyo-zero-sugar-color);color: #2196f3;border: 1px solid rgba(33, 150, 243, 0.3);}
    .type-tag.good-trip-iced-tea {background: var(--good-trip-color);color: #4caf50;border: 1px solid rgba(76, 175, 80, 0.3);}
    .type-tag.pop-edition-low-sugar {background: var(--pop-edition-color);color: #9c27b0;border: 1px solid rgba(156, 39, 176, 0.3);}
    .type-tag.other {background: var(--other-type-color);color: #9e9e9e;border: 1px solid rgba(158, 158, 158, 0.3);}
    .type-tag.default {background: var(--default-type-color);color: #ffc107;border: 1px solid rgba(255, 193, 7, 0.3);}

    /* PRODUCTS */
    .product-list {display: flex;flex-direction: column;gap: 12px;}
    .product-item {
      background: #000;border-radius: 12px;padding: 16px;display: flex;align-items: center;gap: 16px;
      transition: all 0.3s ease;
    }
    .product-item.toyo-low-sugar {border-left: 4px solid #ff5722;background: linear-gradient(90deg, rgba(255, 87, 34, 0.05) 0%, rgba(0,0,0,1) 20%);}
    .product-item.toyo-zero-sugar {border-left: 4px solid #2196f3;background: linear-gradient(90deg, rgba(33, 150, 243, 0.05) 0%, rgba(0,0,0,1) 20%);}
    .product-item.good-trip-iced-tea {border-left: 4px solid #4caf50;background: linear-gradient(90deg, rgba(76, 175, 80, 0.05) 0%, rgba(0,0,0,1) 20%);}
    .product-item.pop-edition-low-sugar {border-left: 4px solid #9c27b0;background: linear-gradient(90deg, rgba(156, 39, 176, 0.05) 0%, rgba(0,0,0,1) 20%);}
    .product-item.other {border-left: 4px solid #9e9e9e;background: linear-gradient(90deg, rgba(158, 158, 158, 0.05) 0%, rgba(0,0,0,1) 20%);}
    .product-item.default {border-left: 4px solid #ffc107;background: linear-gradient(90deg, rgba(255, 193, 7, 0.05) 0%, rgba(0,0,0,1) 20%);}
    
    .product-info {flex: 1;}
    .product-name {font-size: 18px;font-weight: 700;margin-bottom: 4px;}
    .product-meta {font-size: 14px;color: var(--accent-yellow);display: flex;gap: 12px;}
    .product-type-badge {
      font-size: 12px;color: rgba(255, 255, 255, 0.9);padding: 2px 8px;border-radius: 4px;font-weight: 600;
    }
    .product-type-badge.toyo-low-sugar {background: rgba(255, 87, 34, 0.2);border: 1px solid rgba(255, 87, 34, 0.4);}
    .product-type-badge.toyo-zero-sugar {background: rgba(33, 150, 243, 0.2);border: 1px solid rgba(33, 150, 243, 0.4);}
    .product-type-badge.good-trip-iced-tea {background: rgba(76, 175, 80, 0.2);border: 1px solid rgba(76, 175, 80, 0.4);}
    .product-type-badge.pop-edition-low-sugar {background: rgba(156, 39, 176, 0.2);border: 1px solid rgba(156, 39, 176, 0.4);}
    .product-type-badge.other {background: rgba(158, 158, 158, 0.2);border: 1px solid rgba(158, 158, 158, 0.4);}
    .product-type-badge.default {background: rgba(255, 193, 7, 0.2);border: 1px solid rgba(255, 193, 7, 0.4);}

    .quantity-controls {display: flex;align-items: center;gap: 5px;}
    .qty-input {
      width: 60px;background: #111;border: 1px solid rgba(255,255,255,.2);border-radius: 8px;
      padding: 8px;font-size: 16px;font-weight: 700;color: #fff;text-align: center;
      -moz-appearance: textfield;-webkit-appearance: none;appearance: none;
    }
    .qty-input::-webkit-outer-spin-button, .qty-input::-webkit-inner-spin-button {-webkit-appearance: none;margin: 0;}
    
    .qty-btn {
      width: 36px;height: 36px;border-radius: 8px;background: #111;color: #fff;
      border: 1px solid rgba(255,255,255,.2);font-size: 20px;font-weight: 700;
      cursor: pointer;display: flex;align-items: center;justify-content: center;
      -webkit-tap-highlight-color: transparent;touch-action: manipulation;user-select: none;
    }
    .qty-btn:hover {background: #222;}
    @media (hover: none) and (pointer: coarse) {.qty-btn {font-size: 25px;}.qty-btn:active {background: #222;transform: scale(0.95);}}

    /* OUTLET FILTERS */
    .outlet-filter-section {margin-top: 16px;display: flex;flex-direction: column;gap: 12px;}
    .outlet-filter-row {display: flex;gap: 12px;align-items: center;}
    .outlet-filter-label {font-size: 14px;color: var(--accent-yellow);min-width: 100px;}
    .outlet-type-buttons {display: flex;flex-wrap: wrap;gap: 8px;flex: 1;}
    .outlet-type-btn {
      padding: 12px 16px;border-radius: 8px;background: rgba(255, 255, 255, 0.1);
      color: var(--gray-light);border: none;cursor: pointer;font-size: 14px;font-weight: 600;
      -webkit-tap-highlight-color: transparent;touch-action: manipulation;
    }
    .outlet-type-btn.active {background: rgba(255, 215, 0, 0.2);color: var(--accent-yellow);box-shadow: 0 0 0 2px var(--accent-yellow);}

    /* SUMMARY */
    table{width:100%;border-collapse:collapse}
    td{padding:14px 0;font-size:20px;font-weight:850;border-bottom:1px solid rgba(255,255,255,.08)}
    td:nth-child(2), td:nth-child(3){text-align:right}
    .summary-pill{background:#000;border-radius:20px;padding:18px;font-size:22px;font-weight:800;text-align:center;margin:18px 0}

    .button-group{display:flex;gap:12px;flex-wrap:wrap;}
    .btn{
      border-radius:12px;padding:18px;font-weight:700;border:none;cursor:pointer;font-size:16px;
      -webkit-tap-highlight-color: transparent;touch-action: manipulation;
    }
    .btn.submit{flex:1;background:linear-gradient(135deg,var(--accent-yellow),var(--dark-yellow));min-width:120px;}
    .btn.clear{flex:1;background:rgba(255,255,255,.08);color:#fff;min-width:120px;}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .btn.location{background:linear-gradient(135deg,#4caf50,#45a049);color:#fff;flex:1;min-width:120px;}

    .message{margin-top:16px;padding:12px;border-radius:10px;font-size:13px;display:none}
    .message.success{display:block;background:rgba(40,167,69,.15);color:#28a745}
    .message.error{display:block;background:rgba(220,53,69,.15);color:#dc3545}

    .hidden{display:none}
    .add-btn{
      display:inline-flex;align-items:center;gap:8px;background:#000;border:1px dashed var(--accent-yellow);
      color:var(--accent-yellow);padding:14px 18px;border-radius:10px;cursor:pointer;font-weight:700;font-size:16px;
      -webkit-tap-highlight-color: transparent;touch-action: manipulation;
    }

    .empty-state {text-align: center;padding: 40px 20px;color: rgba(255,255,255,.5);}
    .skeleton {background: #333;border-radius: 4px;animation: pulse 1.5s infinite;}
    .location-status {font-size: 12px;color: var(--accent-yellow);margin-top: 4px;}

    @keyframes pulse {0%,100%{opacity:1}50%{opacity:.5}}
    @media (max-width: 768px) {
      body {font-size: 14px;}
      .wrap {padding: 12px;}
      .card {padding: 14px;}
      .qty-btn {width: 46px;height: 46px;font-size: 22px;}
      .qty-input {width: 80px;height: 56px;font-size: 20px;}
      .button-group{flex-direction:column;}
    }
  </style>
</head>

<body>
  <div class="wrap">
    <!-- AUTH BAR -->
    <div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
      <div>
        <div style="font-size:13px;color:var(--gray-light);margin-bottom:4px;">Signed in as</div>
        <div id="userEmail" style="font-size:16px;font-weight:800;">Not signed in</div>
      </div>
      <div style="display:flex;gap:10px;align-items:center;">
        <div id="googleLoginContainer" style="display: flex; justify-content: center;">
          <div id="loginBtn"></div>
        </div>
        <button type="button" id="logoutBtn" class="btn draft" style="padding:12px 16px;flex:none;display:none;" onclick="app.logout()">Logout</button>
      </div>
    </div>

    <div class="header">
      <div class="logo-icon">S</div>
      <h1>K95 Foods Outlet Stock Form</h1>
    </div>

    <!-- OUTLET STOCK DETAILS -->
    <div class="card">
      <div class="card-title">Stock Details</div>
      <label>Distributor</label>
      <select id="distributorSel" onchange="app.onDistributorChange(this.value)"><option>Loading...</option></select>

      <div style="margin:16px 0">
        <button type="button" class="add-btn" onclick="app.toggleNewOutlet()"> Add new outlet</button>
      </div>

      <div id="existingOutletBox">
        <div class="outlet-filter-section" id="outletFilterSection">
          <div class="outlet-filter-row">
            <div class="outlet-filter-label">Outlet Type:</div>
            <div class="outlet-type-buttons" id="outletTypeButtons">
              <button type="button" class="outlet-type-btn active" data-type="ALL">All</button>
            </div>
          </div>
        </div>
        <label>Outlet</label>
        <select id="outletSel" onchange="app.onOutletChange()"><option>Select outlet</option></select>
        <label>Selected Outlet Type</label>
        <input id="selectedOutletType" disabled>
      </div>

      <div id="newOutletBox" class="hidden">
        <label>New Outlet Name</label>
        <input id="newOutletName" placeholder="Enter Outlet Name with Location" oninput="app.handleOutletNameInput()">
        <label>Generated Outlet ID</label>
        <input id="newOutletId" disabled>
        <label>New Outlet Type</label>
        <select id="newOutletType">
          <option>GTM</option><option>HVO</option><option>HORECA</option>
        </select>
      </div>

      <label>Location</label>
      <div style="position:relative;">
        <input id="locationUrl" placeholder="Paste Google Maps URL or click Get Location">
        <button type="button" class="btn location" onclick="app.getCurrentLocation()" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);width:150px;padding:12px 8px;font-size:14px;">Get Location</button>
      </div>
      <div id="locationStatus" class="location-status"></div>

      <label>Stock Photo</label>
      <input type="url" id="stockPhotoUrl" placeholder="Optional: Stock Photo URL">

      <label>Comments</label>
      <textarea id="commentBox" placeholder="Additional comments about stock condition"></textarea>
    </div>

    <!-- PRODUCTS STOCK -->
    <div class="card">
      <div class="card-title">Current Stock</div>
      <div class="filter-section">
        <div class="filter-label">Filter by Type:</div>
        <div class="type-filters" id="typeFilters">
          <div class="type-tag active default" data-type="all">All Types</div>
        </div>
      </div>
      <div class="product-list" id="productList">
        <div class="empty-state skeleton">Loading products...</div>
      </div>
    </div>

    <!-- STOCK SUMMARY -->
    <div class="card">
      <div class="card-title">Stock Summary</div>
      <table><tbody id="previewBody"></tbody></table>
      <div class="summary-pill" id="totalsPill">Total items: 0</div>
      <div class="button-group">
        <button id="submitBtn" class="btn submit" onclick="app.submitStock()">Submit Stock</button>
        <button class="btn clear" onclick="app.clearForm()">Clear</button>
      </div>
      <div id="msg" class="message"></div>
    </div>
  </div>

<script>
class K95StockForm {
  constructor() {
    this.API_URL = 'https://script.google.com/a/macros/toyokombucha.com/s/AKfycbzqqtDSqp4Dkp4Ve4tN-aUSv70uqOtLLkTW25L5qBNCkvdDLyK_dUKdi4mRqF0-Myru/exec';
    this.GOOGLE_CLIENT_ID = '22790727857-efogpi8phcmv76a3sotlnccptapi5sq1.apps.googleusercontent.com';
    
    this.CACHE = {
      DISTRIBUTORS: 'k95_distributors',
      PRODUCTS: 'k95_products',
      OUTLETS: 'k95_outlets_',
      LAST_UPDATE: 'k95_cache_update',
      LAST_DISTRIBUTOR: 'k95_last_distributor'
    };
    
    this.data = {
      distributors: [], products: [], outlets: {},
      qtyByProduct: {}, currentDistributor: '', currentOutlet: ''
    };
    
    this.isNewOutlet = false;
    this.currentType = 'all';
    this.currentOutletType = 'ALL';
    this.outletsData = [];
    this.idToken = localStorage.getItem('k95_id_token') || '';
    this.userEmail = localStorage.getItem('k95_email') || '';
    this.locationRetries = 0;
    
    this.init();
  }

  async init() {
    this.showSkeleton();
    
    if (this.idToken && this.userEmail && this.isCacheFresh()) {
      await this.loadFromCache();
      this.renderEverything();
      this.setAuthUI(true);
      return;
    }
    
    this.initGoogleAuth();
    if (this.idToken && this.userEmail) {
      this.setAuthUI(true);
      await this.refreshAllData();
    }
  }

  isCacheFresh() {
    const lastUpdate = localStorage.getItem(this.CACHE.LAST_UPDATE);
    if (!lastUpdate) return false;
    return (Date.now() - parseInt(lastUpdate)) < (24 * 60 * 60 * 1000);
  }

  async loadFromCache() {
    const distributors = localStorage.getItem(this.CACHE.DISTRIBUTORS);
    const products = localStorage.getItem(this.CACHE.PRODUCTS);
    const lastDistributor = localStorage.getItem(this.CACHE.LAST_DISTRIBUTOR);
    
    if (distributors) this.data.distributors = JSON.parse(distributors);
    if (products) this.data.products = JSON.parse(products);
    
    if (lastDistributor) {
      const cachedOutlets = localStorage.getItem(this.CACHE.OUTLETS + lastDistributor);
      if (cachedOutlets) {
        this.data.outlets[lastDistributor] = JSON.parse(cachedOutlets);
        this.outletsData = this.data.outlets[lastDistributor];
      }
    }
  }

  async refreshAllData() {
    try {
      const [distributorsRes, productsRes] = await Promise.all([
        this.apiCall('init'),
        this.apiCall('getProducts')
      ]);
      
      this.data.distributors = distributorsRes.distributors || [];
      this.data.products = productsRes.products || [];
      
      this.cacheAllData();
      
      if (this.data.distributors[0]) {
        this.preloadOutlets(this.data.distributors[0].id);
      }
      
      this.renderEverything();
    } catch (e) {
      console.error('Refresh failed:', e);
      this.showMsg('Failed to load data', 'error');
    }
  }

  cacheAllData() {
    localStorage.setItem(this.CACHE.DISTRIBUTORS, JSON.stringify(this.data.distributors));
    localStorage.setItem(this.CACHE.PRODUCTS, JSON.stringify(this.data.products));
    localStorage.setItem(this.CACHE.LAST_UPDATE, Date.now().toString());
  }

  async preloadOutlets(distributorId) {
    try {
      const outlets = await this.apiCall('getOutletsByDistributor', { distributorId });
      this.data.outlets[distributorId] = outlets.outlets || outlets;
      localStorage.setItem(this.CACHE.OUTLETS + distributorId, JSON.stringify(this.data.outlets[distributorId]));
    } catch (e) {}
  }

  initGoogleAuth() {
    if (window.google?.accounts?.id) {
      google.accounts.id.initialize({
        client_id: this.GOOGLE_CLIENT_ID,
        callback: (resp) => this.handleGoogleLogin(resp)
      });
      
      google.accounts.id.renderButton(
        document.getElementById('loginBtn'),
        { theme: 'filled_black', size: 'large', text: 'signin_with', width: '250' }
      );
    } else {
      setTimeout(() => this.initGoogleAuth(), 50);
    }
  }

  async handleGoogleLogin(resp) {
    try {
      const payload = JSON.parse(atob(resp.credential.split('.')[1]
        .replace(/-/g, '+').replace(/_/g, '/')));
      
      this.idToken = resp.credential;
      this.userEmail = payload.email;
      
      localStorage.setItem('k95_id_token', this.idToken);
      localStorage.setItem('k95_email', this.userEmail);
      
      this.setAuthUI(true);
      await this.refreshAllData();
    } catch (e) {
      this.showMsg('Login failed', 'error');
    }
  }

  setAuthUI(loggedIn) {
    document.getElementById('userEmail').textContent = loggedIn ? this.userEmail : 'Not signed in';
    document.getElementById('loginBtn').style.display = loggedIn ? 'none' : 'inline-flex';
    document.getElementById('logoutBtn').style.display = loggedIn ? 'inline-flex' : 'none';
  }

  logout() {
    localStorage.clear();
    this.idToken = this.userEmail = '';
    this.data = { distributors: [], products: [], outlets: {}, qtyByProduct: {}, currentDistributor: '', currentOutlet: '' };
    this.setAuthUI(false);
    document.getElementById('productList').innerHTML = '<div class="empty-state">Please login to load products...</div>';
  }

  async apiCall(action, params = {}) {
    const query = new URLSearchParams({ action, idToken: this.idToken, ...params }).toString();
    const res = await fetch(`${this.API_URL}?${query}`);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'API Error');
    return data.data;
  }

  showSkeleton() {
    document.getElementById('productList').innerHTML = `
      <div class="product-item skeleton" style="height:100px;">
        <div style="flex:1;">
          <div style="width:70%;height:20px;background:#333;border-radius:4px;"></div>
          <div style="width:50%;height:16px;background:#333;border-radius:4px;margin-top:8px;"></div>
        </div>
      </div>
    `;
  }

  renderEverything() {
    this.renderDistributors();
    if (this.data.currentDistributor) this.renderOutlets();
    this.renderProducts();
  }

  renderDistributors() {
    const sel = document.getElementById('distributorSel');
    sel.innerHTML = this.data.distributors.length ?
      this.data.distributors.map(d => `<option value="${d.id}">${d.name}</option>`).join('') :
      '<option>No distributors found</option>';
    
    const lastDistributor = localStorage.getItem(this.CACHE.LAST_DISTRIBUTOR);
    if (lastDistributor && sel.querySelector(`[value="${lastDistributor}"]`)) {
      sel.value = lastDistributor;
      this.onDistributorChange(lastDistributor);
    }
  }

  async onDistributorChange(distributorId) {
    this.data.currentDistributor = distributorId;
    localStorage.setItem(this.CACHE.LAST_DISTRIBUTOR, distributorId);
    
    const cached = localStorage.getItem(this.CACHE.OUTLETS + distributorId);
    if (cached) {
      this.outletsData = JSON.parse(cached);
      this.renderOutlets();
      return;
    }

    try {
      const outlets = await this.apiCall('getOutletsByDistributor', { distributorId });
      this.outletsData = outlets.outlets || outlets;
      localStorage.setItem(this.CACHE.OUTLETS + distributorId, JSON.stringify(this.outletsData));
      this.renderOutlets();
    } catch (e) {
      this.showMsg('Failed to load outlets', 'error');
    }
  }

  renderOutlets() {
    const typeButtons = document.getElementById('outletTypeButtons');
    const types = [...new Set(this.outletsData.map(o => o.type || 'UNKNOWN'))];
    
    typeButtons.innerHTML = '<button type="button" class="outlet-type-btn active" data-type="ALL">All</button>' +
      types.map(t => `<button type="button" class="outlet-type-btn" data-type="${t}">${t}</button>`).join('');
    
    this.filterOutletsByType();
  }

  filterOutletsByType() {
    let filtered = this.outletsData;
    if (this.currentOutletType !== 'ALL') {
      filtered = this.outletsData.filter(o => o.type === this.currentOutletType);
    }
    
    document.getElementById('outletSel').innerHTML = filtered.map(o => 
      `<option value="${o.id}">${o.name}</option>`).join('') || '<option>No outlets found</option>';
  }

  onOutletChange() {
    const selected = this.outletsData.find(o => o.id === document.getElementById('outletSel').value);
    document.getElementById('selectedOutletType').value = selected?.type || '';
  }

  toggleNewOutlet() {
    this.isNewOutlet = !this.isNewOutlet;
    document.getElementById('existingOutletBox').classList.toggle('hidden', this.isNewOutlet);
    document.getElementById('newOutletBox').classList.toggle('hidden', !this.isNewOutlet);
    document.getElementById('outletFilterSection').classList.toggle('hidden', this.isNewOutlet);
  }

  handleOutletNameInput() {
    let v = document.getElementById('newOutletName').value;
    v = v.replace(/\b\w/g, c => c.toUpperCase());
    document.getElementById('newOutletName').value = v;
    
    const clean = v.toUpperCase().replace(/[^A-Z0-9]/g, '');
    const outletId = clean ? `${clean.slice(0,6)}-${Math.random().toString(36).substring(2,6).toUpperCase()}` : '';
    document.getElementById('newOutletId').value = outletId;
  }

  async getCurrentLocation() {
    const statusEl = document.getElementById('locationStatus');
    
    if (!navigator.geolocation) {
      statusEl.textContent = 'Geolocation not supported';
      return;
    }

    statusEl.textContent = 'Getting location...';
    
    const success = (position) => {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      const url = `https://maps.google.com/?q=${lat},${lng}`;
      document.getElementById('locationUrl').value = url;
      statusEl.textContent = 'Location captured!';
      statusEl.style.color = '#4caf50';
      this.locationRetries = 0;
    };

    const error = (err) => {
      this.locationRetries++;
      if (this.locationRetries < 5) {
        statusEl.textContent = `Retry ${this.locationRetries}/5...`;
        setTimeout(() => navigator.geolocation.getCurrentPosition(success, error), 1000);
      } else {
        statusEl.textContent = 'Failed to get location. Please paste Google Maps URL manually.';
        statusEl.style.color = '#f44336';
      }
    };

    navigator.geolocation.getCurrentPosition(success, error);
  }

  renderProducts() {
    const container = document.getElementById('productList');
    if (!this.data.products.length) {
      container.innerHTML = '<div class="empty-state">No products available</div>';
      return;
    }

    let filtered = this.data.products;
    if (this.currentType !== 'all') {
      filtered = filtered.filter(p => p.type === this.currentType);
    }

    if (!filtered.length) {
      container.innerHTML = '<div class="empty-state">No products match this filter</div>';
      return;
    }

    const typeColorMap = {
      'Toyo Low Sugar': 'toyo-low-sugar', 'Toyo Zero Sugar': 'toyo-zero-sugar',
      'Good Trip Iced Tea': 'good-trip-iced-tea', 'Pop Edition Low Sugar': 'pop-edition-low-sugar',
      'OTHER': 'other'
    };

    container.innerHTML = filtered.map(product => {
      const qty = this.data.qtyByProduct[product.id] || 0;
      const typeClass = typeColorMap[product.type] || 'default';
      return `
        <div class="product-item ${typeClass}">
          <div class="product-info">
            <div class="product-name">${product.name}</div>
            <div class="product-meta">
              ${product.type ? `<span class="product-type-badge ${typeClass}">${product.type}</span>` : ''}
            </div>
          </div>
          <div class="quantity-controls">
            <button class="qty-btn" onclick="app.changeQty('${product.id}', -1)">-</button>
            <input type="number" class="qty-input" id="q_${product.id}" value="${qty}" min="0"
              onchange="app.updateQty('${product.id}', this.value)" oninput="app.validateQty(this)">
            <button class="qty-btn" onclick="app.changeQty('${product.id}', 1)">+</button>
          </div>
        </div>
      `;
    }).join('');
  }

  changeQty(productId, delta) {
    const current = this.data.qtyByProduct[productId] || 0;
    const newQty = Math.max(0, current + delta);
    this.data.qtyByProduct[productId] = newQty;
    document.getElementById(`q_${productId}`).value = newQty;
    this.renderPreview();
  }

  updateQty(productId, value) {
    const num = parseInt(value) || 0;
    this.data.qtyByProduct[productId] = Math.max(0, num);
    document.getElementById(`q_${productId}`).value = this.data.qtyByProduct[productId];
    this.renderPreview();
  }

  validateQty(input) {
    input.value = input.value.replace(/[^0-9]/g, '');
  }

  renderPreview() {
    let totalItems = 0;
    const rows = [];
    
    this.data.products.forEach(product => {
      const qty = this.data.qtyByProduct[product.id] || 0;
      if (qty > 0) {
        totalItems += qty;
        rows.push(`
          <tr>
            <td>${product.name}</td>
            <td>${qty}</td>
          </tr>
        `);
      }
    });
    
    document.getElementById('previewBody').innerHTML = rows.join('');
    document.getElementById('totalsPill').textContent = `Total items reported: ${totalItems}`;
  }

  async submitStock() {
    if (this.isNewOutlet && !document.getElementById('newOutletName').value.trim()) {
      return this.showMsg('New outlet name is required', 'error');
    }
    
    if (!this.data.currentDistributor) {
      return this.showMsg('Please select distributor', 'error');
    }
    
    const hasItems = Object.values(this.data.qtyByProduct).some(qty => qty > 0);
    if (!hasItems) return this.showMsg('Please enter stock for at least one product', 'error');

    const distributor = this.data.distributors.find(d => d.id === this.data.currentDistributor);
    
    document.getElementById('submitBtn').disabled = true;

    try {
      // Copy to clipboard first
      const now = new Date().toLocaleString('en-IN', { 
        timeZone: 'Asia/Kolkata',
        weekday: 'short', 
        year: 'numeric', 
        month: 'short', 
        day: 'numeric', 
        hour: '2-digit', 
        minute: '2-digit' 
      });
      
      let clipboardText = `📦 *STOCK REPORT* 📦\n\n`;
      clipboardText += `🕒 *Date/Time:* ${now}\n`;
      clipboardText += `🏢 *Distributor:* ${distributor?.name || 'N/A'}\n`;
      
      const outletName = this.isNewOutlet ? 
        document.getElementById('newOutletName').value.trim() : 
        this.outletsData.find(o => o.id === document.getElementById('outletSel').value)?.name || '';
      const outletType = document.getElementById('selectedOutletType').value || document.getElementById('newOutletType').value;
      
      clipboardText += `🏪 *Outlet:* ${outletName}\n`;
      clipboardText += `📋 *Type:* ${outletType}${this.isNewOutlet ? ' *(NEW)*' : ''}\n\n`;
      clipboardText += `📊 *STOCK DETAILS:*\n`;
      
      this.data.products.forEach(product => {
        const qty = this.data.qtyByProduct[product.id] || 0;
        if (qty > 0) {
          clipboardText += `• ${product.name}: *${qty}*\n`;
        }
      });
      
      clipboardText += `\n📍 *Location:* ${document.getElementById('locationUrl').value || 'N/A'}\n`;
      clipboardText += `💬 *Comments:* ${document.getElementById('commentBox').value || 'None'}\n\n`;
      clipboardText += `✅ Reported by: ${this.userEmail}`;
      
      await navigator.clipboard.writeText(clipboardText);
      
      // Submit to sheet
      const result = await this.apiCall('submitStock', {
        payload: JSON.stringify({
          distributorId: this.data.currentDistributor,
          distributorName: distributor?.name || '',
          outletId: this.isNewOutlet ? null : document.getElementById('outletSel').value,
          outletName: outletName,
          outletType: outletType,
          newOutlet: this.isNewOutlet,
          locationUrl: document.getElementById('locationUrl').value,
          stockPhotoUrl: document.getElementById('stockPhotoUrl').value,
          comment: document.getElementById('commentBox').value,
          items: Object.entries(this.data.qtyByProduct)
            .filter(([_, qty]) => qty > 0)
            .map(([productId, qty]) => {
              const product = this.data.products.find(p => p.id === productId);
              return { 
                productId, 
                productName: product?.name || '',
                qtyOnHand: Number(qty),
                orderMade: 0 
              };
            })
        })
      });
      
      this.showMsg(`✅ Stock submitted successfully! Data copied to clipboard. Paste to WhatsApp group.`, 'success');
      this.clearForm();
    } catch (e) {
      this.showMsg('Error: ' + e.message, 'error');
    } finally {
      document.getElementById('submitBtn').disabled = false;
    }
  }

  showMsg(text, type) {
    const msg = document.getElementById('msg');
    msg.textContent = text;
    msg.className = `message ${type}`;
    setTimeout(() => msg.className = 'message', 8000);
  }

  clearForm() {
    this.data.qtyByProduct = {};
    document.querySelectorAll('.qty-input').forEach(input => input.value = 0);
    document.getElementById('previewBody').innerHTML = '';
    document.getElementById('totalsPill').textContent = 'Total items: 0';
    document.getElementById('commentBox').value = '';
    document.getElementById('newOutletName').value = document.getElementById('newOutletId').value = '';
    document.getElementById('locationUrl').value = '';
    document.getElementById('stockPhotoUrl').value = '';
    document.getElementById('selectedOutletType').value = '';
    
    this.currentType = 'all';
    this.currentOutletType = 'ALL';
    this.isNewOutlet = false;
    document.getElementById('existingOutletBox').classList.remove('hidden');
    document.getElementById('newOutletBox').classList.add('hidden');
    document.getElementById('outletFilterSection').classList.remove('hidden');
    
    document.querySelectorAll('.type-tag')[0]?.classList.add('active');
    document.querySelectorAll('.outlet-type-btn')[0]?.classList.add('active');
    
    this.renderProducts();
    this.filterOutletsByType();
  }
}

// Global event listeners
document.addEventListener('click', (e) => {
  if (e.target.classList.contains('type-tag')) {
    document.querySelectorAll('.type-tag').forEach(t => t.classList.remove('active'));
    e.target.classList.add('active');
    app.currentType = e.target.dataset.type;
    app.renderProducts();
  }
  
  if (e.target.classList.contains('outlet-type-btn')) {
    document.querySelectorAll('.outlet-type-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    app.currentOutletType = e.target.dataset.type;
    app.filterOutletsByType();
  }
});

// Initialize app
const app = new K95StockForm();
</script>
</body>
</html>
