<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, shrink-to-fit=no">
    <title>K95 Sales Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="sales_dashboard.css?v=3.5">
</head>
<body>
    <div class="app-header">
        <div class="app-header-left">
            <div class="logo-icon"><i class="fas fa-chart-line"></i></div>
            <h1>K95 Sales</h1>
        </div>
        <div class="app-header-right">
            <div class="user-badge">
                <div class="user-avatar" id="userInitials">--</div>
                <div class="user-details">
                    <span id="userName">Loading...</span>
                    <span id="userRole">Sales Rep</span>
                </div>
            </div>
            <button class="header-btn" id="refreshBtn" title="Refresh"><i class="fas fa-rotate"></i></button>
            <button class="header-btn" id="homeBtn" title="Home"><i class="fas fa-house"></i></button>
        </div>
    </div>

    <div class="tab-bar">
        <button class="tab active" data-tab="mtd">MTD Progress</button>
        <button class="tab" data-tab="today">Today's Report</button>
    </div>

    <!-- Filters (Collapsible) -->
    <div class="filter-panel collapsed">
        <div class="filter-panel-header">
            <span><i class="fas fa-sliders-h"></i> Filters</span>
            <i class="fas fa-chevron-down"></i>
        </div>
        <div class="filter-panel-body">
            <div class="filter-group">
                <label>Distributors</label>
                <div id="distributorCheckboxGroup" class="checkbox-list"></div>
            </div>
            <div class="filter-group">
                <label>Order Status</label>
                <div class="checkbox-row">
                    <label><input type="checkbox" value="Pending" class="mtdStatusFilter" checked> Pending</label>
                    <label><input type="checkbox" value="Confirmed" class="mtdStatusFilter" checked> Confirmed</label>
                    <label><input type="checkbox" value="Delivered" class="mtdStatusFilter" checked> Delivered</label>
                    <label><input type="checkbox" value="Draft" class="mtdStatusFilter" checked> Draft</label>
                    <label><input type="checkbox" value="Cancelled" class="mtdStatusFilter"> Cancelled</label>
                </div>
            </div>
            <div class="filter-actions">
                <button class="btn btn-primary" id="applyFiltersBtn">Apply</button>
                <button class="btn btn-secondary" id="resetFiltersBtn">Reset</button>
            </div>
        </div>
    </div>

    <div id="mtdContent" class="tab-content active"></div>
    <div id="todayContent" class="tab-content"></div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(r => r.forEach(reg => reg.unregister()));
        }
        if ('caches' in window) {
            caches.keys().then(keys => Promise.all(keys.map(key => caches.delete(key))));
        }
    </script>
    <script src="sales_dashboard.js?v=3.7"></script>
</body>
</html>
